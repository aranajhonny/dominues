<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dominos Online — Mesa de Juego</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body { background: #151922; color: #e9ecef; font-family: system-ui, sans-serif; }
    .topbar { background: #1b1f2a; border-bottom: 1px solid #2b3245; }
    .card-d { background: #242a3a; border: 1px solid #3a4157; border-radius: .75rem; }
    .tile {
      background: #f8f9fa; color: #111; border-radius: .45rem; margin: 4px;
      width: 44px; height: 44px; display: grid; place-items: center;
      font-weight: 700; cursor: pointer; user-select: none;
      box-shadow: 0 2px 6px rgba(0,0,0,.45); position: relative;
    }
    .tile.horizontal { width: 64px; height: 34px; }
    .tile.double { width: 40px; height: 52px; }
    .tile.empty { background: transparent; border: 2px dashed #3a4157; color: transparent; cursor: default; }
    .tile.private { width: 72px; height: 40px; font-size: 1.05rem; }
    .tile.playable { box-shadow: 0 0 0 3px #f5b942, 0 2px 6px rgba(0,0,0,.45); }
    .tile.played { cursor: default; }
    .board-line { display: flex; flex-wrap: wrap; min-height: 90px; align-items: center; justify-content: center; }
    .hand { display: flex; flex-wrap: wrap; justify-content: center; padding: .5rem 0; }
    .pip-half { display: grid; place-items: center; font-weight: 800; flex: 1; }
    .seat { border-left: 4px solid transparent; }
    .seat.turn { border-left-color: #f5b942; }
    .seat.me { background: rgba(245,185,66,.06); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #111; }
    .pips { display: grid; grid-template-columns: repeat(3, 9px); grid-template-rows: repeat(3, 9px); gap: 1px; place-items: center; width: 30px; height: 30px; }
    #chat-log { height: 150px; overflow-y: auto; font-size: .85rem; }
    .hidden { display: none !important; }
    .badge-status { font-size: .8rem; }
  </style>
</head>
<body>
  <div class="topbar py-2 px-3 d-flex justify-content-between align-items-center">
    <div><span class="text-warning fw-bold">♦</span> <strong>Dominos Online</strong> <span class="text-secondary small">— Mesa de juego</span></div>
    <div class="d-flex gap-3 align-items-center">
      <span id="lbl-name" class="small"></span>
      <span id="lbl-balance" class="small text-success fw-semibold"></span>
      <a href="/" class="btn btn-outline-light btn-sm">Volver al portal</a>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="view-lobby" class="container py-4">
    <div class="row">
      <div class="col-lg-8">
        <div class="card-d p-3 mb-3">
          <h6 class="mb-3">Mesas disponibles</h6>
          <div id="lobby-games" class="d-grid gap-2"></div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card-d p-3">
          <h6 class="mb-2">Jugadores conectados</h6>
          <div id="lobby-users" class="small"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div id="view-table" class="container py-4 hidden">
    <div class="card-d p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h6 class="mb-0">Mesa <span id="t-match" class="text-secondary small"></span></h6>
          <div id="t-status" class="badge-status mt-1 badge bg-secondary"></div>
        </div>
        <div class="d-flex gap-2">
          <button id="btn-start" class="btn btn-warning btn-sm hidden">Iniciar partida</button>
          <button id="btn-pass" class="btn btn-outline-light btn-sm hidden">Pasar</button>
          <button id="btn-resign" class="btn btn-outline-danger btn-sm">Abandonar</button>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-8">
        <div class="card-d p-3 mb-3">
          <h6 class="text-secondary small text-uppercase mb-2">Mesa de dominó</h6>
          <div id="board" class="board-line"></div>
        </div>
        <div class="card-d p-3">
          <h6 class="text-secondary small text-uppercase mb-2">Seats</h6>
          <div id="seats" class="d-grid gap-2"></div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card-d p-3 mb-3">
          <h6 class="text-secondary small text-uppercase">Tu mano</h6>
          <div id="hand" class="hand"></div>
          <div id="turn-hint" class="small text-warning text-center py-1"></div>
        </div>
        <div class="card-d p-3">
          <h6 class="text-secondary small text-uppercase">Chat</h6>
          <div id="chat-log" class="mb-2"></div>
          <div class="input-group input-group-sm">
            <input id="chat-input" class="form-control" placeholder="Escribe…" maxlength="300">
            <button id="chat-send" class="btn btn-warning">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 2000"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/game.js"></script>
</body>
</html>
